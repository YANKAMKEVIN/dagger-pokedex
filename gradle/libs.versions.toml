[versions]
# --- Build toolchain ---------------------------------------------------------
agp = "8.13.0"
kotlin = "2.2.20"
# KSP is the annotation processor engine that Dagger runs through. Its version is
# tied to the Kotlin version: "<kotlinVersion>-<kspVersion>".
ksp = "2.2.20-2.0.4"

# --- Android SDK -------------------------------------------------------------
compileSdk = "36"
minSdk = "24"
targetSdk = "36"

# --- AndroidX / Compose ------------------------------------------------------
# Pinned to the SDK-36 era so they build with AGP 8.13 (newer 2026 releases
# require AGP 9.1 / compileSdk 37).
coreKtx = "1.16.0"
activityCompose = "1.10.1"
composeBom = "2025.09.01"
lifecycle = "2.9.4"

# --- Dagger (the star of the show) -------------------------------------------
dagger = "2.57.2"

# --- Networking --------------------------------------------------------------
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.2"

# --- Images ------------------------------------------------------------------
coil = "3.4.0"

# --- Testing -----------------------------------------------------------------
junit = "4.13.2"
coroutinesTest = "1.10.1"
mockk = "1.13.13"

[libraries]
# AndroidX core + Compose
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Dagger: runtime annotations + the compiler that generates the graph.
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }

# Images (Coil 3, Compose integration + OkHttp network layer)
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
